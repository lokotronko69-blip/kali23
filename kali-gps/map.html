<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALI-ARES // Tactical Offline Map View</title>
  
  <!-- Embedded Offline Leaflet 1.9.4 Core Styles -->
  <style>
    /* Leaflet Core CSS Embedded */
    .leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas, .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer { position: absolute; left: 0; top: 0; }
    .leaflet-container { overflow: hidden; -ms-touch-action: none; touch-action: none; background: #070a10; }
    .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow { -webkit-user-select: none; -moz-user-select: none; user-select: none; -webkit-user-drag: none; }
    .leaflet-tile-loaded { opacity: 1; }
    .leaflet-tile-container { pointer-events: none; }
    .leaflet-pane { z-index: 400; }
    .leaflet-tile-pane { z-index: 200; }
    .leaflet-overlay-pane { z-index: 400; }
    .leaflet-marker-pane { z-index: 600; }
    .leaflet-tooltip-pane { z-index: 650; }
    .leaflet-popup-pane { z-index: 700; }
    .leaflet-control { position: relative; z-index: 800; pointer-events: visiblePainted; pointer-events: auto; }
    .leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
    .leaflet-top { top: 0; } .leaflet-right { right: 0; } .leaflet-bottom { bottom: 0; } .leaflet-left { left: 0; }
    .leaflet-control-zoom { margin: 15px; border-radius: 6px; overflow: hidden; background: #0f172a; border: 1px solid rgba(16, 185, 129, 0.4); }
    .leaflet-control-zoom a { display: block; width: 32px; height: 32px; line-height: 30px; text-align: center; color: #10b981; font-family: monospace; font-size: 18px; font-weight: bold; text-decoration: none; background: #0f172a; border-bottom: 1px solid #1e293b; }
    .leaflet-control-zoom a:hover { background: #1e293b; color: #34d399; }
    
    /* Tactical Theme Styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070a10; font-family: 'Courier New', Courier, monospace; color: #e2e8f0; }
    #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* Dark Tactical Tile Filter */
    .leaflet-tile {
      filter: brightness(0.65) invert(1) contrast(3.2) hue-rotate(200deg) saturate(0.25) !important;
    }

    /* Offline Tactical Grid Canvas Overlay */
    #tactical-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 450;
      opacity: 0.35;
    }

    /* Tactical HUD Overlays */
    .hud-header {
      position: absolute;
      top: 15px;
      left: 60px;
      z-index: 1001;
      background: rgba(10, 16, 26, 0.88);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 12px;
      letter-spacing: 1px;
      color: #10b981;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    .hud-coords {
      position: absolute;
      bottom: 15px;
      left: 15px;
      z-index: 1001;
      background: rgba(10, 16, 26, 0.88);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 11px;
      color: #94a3b8;
      pointer-events: none;
    }
    .hud-coords span { color: #34d399; font-weight: bold; }

    /* Custom Leaflet Popups */
    .leaflet-popup-content-wrapper {
      background: #0b111e !important;
      border: 1px solid #10b981 !important;
      border-radius: 6px !important;
      color: #f1f5f9 !important;
      font-family: inherit;
      padding: 4px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8), 0 0 10px rgba(16, 185, 129, 0.25) !important;
    }
    .leaflet-popup-tip { background: #0b111e !important; border-bottom: 1px solid #10b981; }

    .unit-popup-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .unit-popup-table td { padding: 3px 6px; border-bottom: 1px solid #1e293b; }
    .unit-popup-table .label { color: #64748b; text-transform: uppercase; }
    .unit-popup-table .val { color: #38bdf8; font-weight: bold; text-align: right; }

    /* Marker Animation & Pulse */
    .marker-pulse {
      position: relative;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .marker-pulse .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(16, 185, 129, 0.7);
      animation: tactical-pulse 2s infinite ease-out;
    }
    @keyframes tactical-pulse {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }
  </style>

  <!-- External/Local Fallback Leaflet Library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- PyQt6 WebChannel Bridge (if run under QWebEngineView) -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>

  <div id="map"></div>
  <canvas id="tactical-canvas"></canvas>

  <div class="hud-header">
    <strong style="color: #34d399;">KALI-ARES // MAPA TÁCTICO LOCAL</strong> | E2EE AES-GCM | SISTEMA OFFLINE
  </div>

  <div class="hud-coords" id="coords-display">
    LAT: <span id="cur-lat">40.4168° N</span> | LON: <span id="cur-lon">-03.7038° W</span> | ZOOM: <span id="cur-zoom">14</span>
  </div>

  <script>
    // Initialize Leaflet Map
    var defaultCenter = [40.4168, -3.7038];
    var map = L.map('map', {
      center: defaultCenter,
      zoom: 14,
      zoomControl: true,
      attributionControl: false
    });

    // Tile layer with graceful offline canvas grid fallback
    var tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      errorTileUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><rect width="256" height="256" fill="%23070a10"/><path d="M0,0 L256,256 M0,256 L256,0" stroke="%231e293b" stroke-width="0.5"/></svg>'
    }).addTo(map);

    // Asset Tracking Stores
    var assetMarkers = {};
    var assetTracks = {};
    var assetRangeRings = {};

    // Colors by Unit Type
    var typeColors = {
      drone: '#38bdf8',     // Sky Blue
      operative: '#10b981', // Emerald
      vehicle: '#f59e0b',   // Amber
      asset: '#a855f7'      // Purple
    };

    function createSvgIcon(type, heading, status) {
      var color = typeColors[type] || '#10b981';
      if (status === 'ALERT' || status === 'JAMMING') color = '#ef4444';
      var rot = heading || 0;

      var svgContent = '';
      if (type === 'drone') {
        svgContent = `<polygon points="16,2 24,26 16,20 8,26" fill="${color}" stroke="#070a10" stroke-width="1.5"/>
                      <circle cx="16" cy="14" r="3" fill="#070a10"/>`;
      } else if (type === 'vehicle') {
        svgContent = `<rect x="8" y="6" width="16" height="20" rx="3" fill="${color}" stroke="#070a10" stroke-width="1.5"/>
                      <polygon points="16,2 20,6 12,6" fill="${color}"/>`;
      } else {
        svgContent = `<circle cx="16" cy="16" r="8" fill="${color}" stroke="#070a10" stroke-width="2"/>
                      <polygon points="16,2 20,10 12,10" fill="${color}"/>`;
      }

      var html = `
        <div class="marker-pulse" style="transform: rotate(${rot}deg);">
          <div class="pulse-ring" style="border-color: ${color};"></div>
          <svg width="32" height="32" viewBox="0 0 32 32">${svgContent}</svg>
        </div>
      `;

      return L.divIcon({
        className: 'custom-tactical-marker',
        html: html,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -18]
      });
    }

    // Function called by PyQt6 or web simulation
    window.updateAssetTelemetry = function(data) {
      if (!data || !data.device_id || data.lat === undefined || data.lon === undefined) return;
      var id = data.device_id;
      var lat = parseFloat(data.lat);
      var lon = parseFloat(data.lon);
      var latLng = [lat, lon];
      var type = data._unit_type || 'asset';
      var speed = data.speed !== undefined ? data.speed.toFixed(1) : '0.0';
      var alt = data.alt !== undefined ? data.alt.toFixed(0) : '0';
      var heading = data.heading || 0;
      var battery = data.battery || 100;
      var status = data.status || 'NORMAL';
      var color = typeColors[type] || '#10b981';

      var popupHtml = `
        <div style="font-size: 13px; font-weight: bold; color: ${color}; border-bottom: 1px solid #334155; padding-bottom: 4px; margin-bottom: 6px;">
          ${data._callsign || id} <span style="font-size: 10px; color: #94a3b8; font-weight: normal;">[${id}]</span>
        </div>
        <table class="unit-popup-table">
          <tr><td class="label">ESTADO:</td><td class="val" style="color: ${status==='NORMAL'?'#10b981':'#ef4444'}">${status}</td></tr>
          <tr><td class="label">VELOCIDAD:</td><td class="val">${speed} km/h</td></tr>
          <tr><td class="label">ALTITUD:</td><td class="val">${alt} m MSL</td></tr>
          <tr><td class="label">RUMBO:</td><td class="val">${heading}°</td></tr>
          <tr><td class="label">BATERÍA:</td><td class="val">${battery}%</td></tr>
          <tr><td class="label">COORD:</td><td class="val" style="font-size: 9px;">${lat.toFixed(5)}, ${lon.toFixed(5)}</td></tr>
          <tr><td class="label">CIFRADO:</td><td class="val" style="color:#10b981;">AES-256-GCM ✓</td></tr>
        </table>
      `;

      if (!assetMarkers[id]) {
        // Create marker
        var marker = L.marker(latLng, { icon: createSvgIcon(type, heading, status) }).addTo(map);
        marker.bindPopup(popupHtml);
        assetMarkers[id] = marker;

        // Create breadcrumb trajectory polyline
        var track = L.polyline([latLng], {
          color: color,
          weight: 3,
          opacity: 0.8,
          smoothFactor: 1
        }).addTo(map);
        assetTracks[id] = track;
      } else {
        // Update position and icon rotation
        var marker = assetMarkers[id];
        marker.setLatLng(latLng);
        marker.setIcon(createSvgIcon(type, heading, status));
        marker.getPopup().setContent(popupHtml);

        // Update trail (limit to last 100 points for smooth performance)
        var track = assetTracks[id];
        var latLngs = track.getLatLngs();
        latLngs.push(latLng);
        if (latLngs.length > 150) latLngs.shift();
        track.setLatLngs(latLngs);
      }
    };

    window.centerOnAsset = function(deviceId) {
      if (assetMarkers[deviceId]) {
        var latLng = assetMarkers[deviceId].getLatLng();
        map.panTo(latLng, { animate: true, duration: 0.8 });
        assetMarkers[deviceId].openPopup();
      }
    };

    window.clearAllTracks = function() {
      for (var id in assetTracks) {
        if (assetMarkers[id]) {
          assetTracks[id].setLatLngs([assetMarkers[id].getLatLng()]);
        }
      }
    };

    // Update coordinates display on map mouse movement
    map.on('mousemove', function(e) {
      document.getElementById('cur-lat').innerText = e.latlng.lat.toFixed(5) + '°';
      document.getElementById('cur-lon').innerText = e.latlng.lng.toFixed(5) + '°';
    });
    map.on('zoomend', function() {
      document.getElementById('cur-zoom').innerText = map.getZoom();
    });

    // Draw Military Grid Overlay on Canvas
    function drawTacticalGrid() {
      var canvas = document.getElementById('tactical-canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(16, 185, 129, 0.12)';
      ctx.lineWidth = 1;

      var step = 80;
      for (var x = 0; x < canvas.width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (var y = 0; y < canvas.height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }
    window.addEventListener('resize', drawTacticalGrid);
    drawTacticalGrid();

    // Setup QWebChannel if executed inside PyQt6 QWebEngineView
    if (typeof QWebChannel !== "undefined") {
      new QWebChannel(qt.webChannelTransport, function(channel) {
        window.pyqtBridge = channel.objects.pyqtBridge;
        console.log("[✓] QWebChannel conectado con PyQt6");
      });
    }
  </script>
</body>
</html>
